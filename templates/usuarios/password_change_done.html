{% extends 'base.html' %}

{% block title %}Senha Alterada — ERP{% endblock %}
{% block topbar_title %}Alterar Senha{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Alterar Senha</h1>
</div>

<div class="card-dark" style="max-width: 480px;">
    <div class="card-body">
        <div class="alert-green">
            <i class="ti ti-circle-check me-2"></i>
            Sua senha foi alterada com sucesso.
        </div>
        <a href="{% url 'dashboard' %}" class="btn-green mt-2">
            <i class="ti ti-arrow-left me-1"></i> Voltar ao Dashboard
        </a>
    </div>
</div>
{% endblock %}
