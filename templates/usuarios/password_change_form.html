{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Alterar Senha — ERP{% endblock %}
{% block topbar_title %}Alterar Senha{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Alterar Senha</h1>
</div>

<div class="card-dark" style="max-width: 480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn-green mt-2">
                <i class="ti ti-check me-1"></i> Salvar nova senha
            </button>
        </form>
    </div>
</div>
{% endblock %}
